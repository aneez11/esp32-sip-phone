## ENC28J60 SPI Ethernet controller driver.
##
## The chip driver was removed from the esp_eth core component in ESP-IDF v6
## and now ships on the ESP Component Registry. Declared unconditionally because
## the component manager manifest has no Kconfig-conditional rule; the driver is
## only *used* when CONFIG_SIP_ETH_ENC28J60 is enabled.
dependencies:
  idf:
    version: ">=5.5"
  espressif/enc28j60:
    version: "^1.0.0"
